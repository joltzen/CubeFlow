[project]
name = "cubeflow"
version = "0.1.0"
description = "Interactive Rubik's Cube algorithm visualizer"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8"
]

[project.scripts]
cubeflow = "cubeflow.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]